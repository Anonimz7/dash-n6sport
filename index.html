.logo{display:inline-block;flex:none;height:var(--h,34px);aspect-ratio:1393/657;background:var(--logo);-webkit-mask:var(--logo-img) center/contain no-repeat;mask:var(--logo-img) center/contain no-repeat}
.mlogo{display:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1100px 380px at 90% -60px,var(--accent-soft),transparent 70%),radial-gradient(800px 320px at -5% 0,var(--sky-soft),transparent 70%);background-repeat:no-repeat;color:var(--fg);font-family:var(--f-body);font-size:13.5px;line-height:1.5;padding-inline:16px;padding-block:12px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
body{font-variant-numeric:lining-nums}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em}
[hidden]{display:none!important}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);gap:16px;max-width:1500px;margin:0 auto;align-items:start}
.side{position:sticky;top:12px;background:linear-gradient(175deg,var(--side-1),var(--side-2));border-radius:18px;border:1px solid var(--side-line);padding:16px 10px;max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:14px;color:var(--side-fg);box-shadow:0 16px 36px -20px rgba(11,22,48,.5)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 12px;border-bottom:1px solid var(--side-line)}
.brand b{display:block;font-family:var(--f-display);font-size:14.5px;letter-spacing:.03em;line-height:1.2;color:var(--side-fg)}
.brand .pl{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--side-muted)}
.brand span{font-size:12px;color:var(--side-muted)}
.ng{display:flex;flex-direction:column;gap:2px}
.nl{margin:0 0 4px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:11px;text-align:left;color:var(--side-muted);font-weight:500}
.nav:hover{background:var(--side-hover);color:var(--side-fg)}
.nav[aria-current="page"]{background:linear-gradient(100deg,var(--accent),var(--accent-2));color:var(--accent-fg);font-weight:700;box-shadow:0 6px 16px -8px var(--accent)}
.tag{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-left:auto;padding:1px 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--side-line);margin-top:auto}
.me div{min-width:0;flex:1}
.me b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--side-fg)}
.me span.r{font-size:12px;color:var(--side-muted)}
.me .btn{color:var(--side-fg)}
.me .btn:hover{background:var(--side-hover)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none}
.side .av{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-fg)}
.main{min-width:0;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.tl{display:flex;align-items:center;gap:10px;min-width:0}
.eyebrow{margin:0 0 3px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:26px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent) 0 34%,var(--volt) 34% 67%,var(--sky) 67%);flex:none}
h1{font-size:clamp(26px,3.6vw,34px);line-height:1.08}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;max-width:100%}
.who>span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:linear-gradient(100deg,var(--accent),var(--accent-2));color:var(--accent-fg);font-weight:700;box-shadow:0 4px 12px -6px var(--accent)}
.meta{gap:8px 12px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--sky-soft);font-size:13px}
.banner svg{flex:none;color:var(--sky-ink);margin-top:1px}
.banner.warn{background:var(--warn-soft)}
.banner.warn svg{color:var(--warn)}
.bnav,.rolechip{display:none}
.mlist{display:none;flex-direction:column;gap:8px}
.bdg{position:absolute;top:-3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:var(--surface);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-style:normal}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1.5px solid transparent;background:var(--surface-2);font-size:12px;font-weight:600;text-align:center;min-width:0}
.mt[aria-current="page"]{border-color:var(--accent)}
.mt .tag{margin:0}
.mi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.mt.t1 .mi{background:var(--sky-soft);color:var(--sky-ink)}
.mt.t2 .mi{background:var(--violet-soft);color:var(--violet-ink)}
.mt.t3 .mi{background:var(--volt-soft);color:var(--volt-ink)}
@media (min-width:901px){.mlist{display:none!important}}


/* hero band */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 22px 24px;background:linear-gradient(118deg,#0B1630 0%,#17308F 52%,#2F57E6 100%);color:#fff;display:flex;gap:18px 24px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(112deg,transparent 62%,var(--accent) 62% 67%,transparent 67% 69%,#C8F031 69% 72%,transparent 72% 74%,#2BC4FF 74% 76%,transparent 76%);opacity:.95}
.hero .lanes{position:absolute;right:-30px;top:-20px;width:min(520px,70%);height:auto;z-index:-1;opacity:.55}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h2{font-size:clamp(24px,4.2vw,34px);line-height:1.08;color:#fff}
.hero p.lead{margin-top:6px;color:rgba(255,255,255,.82);max-width:46ch}
.hstats{display:flex;gap:10px;flex-wrap:wrap}
.hs{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:9px 16px;min-width:104px;backdrop-filter:blur(4px)}
.hs b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1}
.hs span{font-size:12px;color:rgba(255,255,255,.8)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(11,22,48,.05),0 10px 24px -16px rgba(11,22,48,.25)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.ch h3{font-size:16px}
.sub{color:var(--muted);font-size:12.5px}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.dash>*{grid-column:span 12}
@media (min-width:720px){.dash>.c6,.dash>.c4{grid-column:span 6}}
@media (min-width:1100px){.dash>.c4{grid-column:span 4}.dash>.c8{grid-column:span 8}}
.stackv{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;border-radius:16px;padding:13px 15px;display:flex;flex-direction:column;gap:2px;min-width:0;color:#0B1630;background:linear-gradient(135deg,#FF7A2F,#FFB347);box-shadow:0 10px 22px -14px rgba(11,22,48,.5)}
.kpi::after{content:"";position:absolute;right:-20px;top:-22px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.3)}
.kpi>*{position:relative;z-index:1}
.kpis>.kpi:nth-child(4n+2){background:linear-gradient(135deg,#22B8F7,#86DEFF)}
.kpis>.kpi:nth-child(4n+3){background:linear-gradient(135deg,#A98BFF,#D5C6FF)}
.kpis>.kpi:nth-child(4n+4){background:linear-gradient(135deg,#B3E51C,#E4FF80)}
.kl{font-size:12px;font-weight:600;opacity:.78}
.kv{font-size:24px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.ks{font-size:12px;opacity:.75}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:0 1px 2px rgba(11,22,48,.05)}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.mh b{font-family:var(--f-display);font-size:24px;color:var(--accent-ink)}
.mf{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.track{height:11px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:block}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.hb{display:flex;flex-direction:column;gap:10px}
.hbr{display:grid;grid-template-columns:minmax(70px,120px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hv{font-family:var(--f-mono);font-size:12.5px;text-align:right;min-width:48px}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:140px;height:140px;flex:none}
.dn{font-family:var(--f-display);font-size:26px;font-weight:700;fill:var(--fg)}
.ds{font-size:10px;fill:var(--muted)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0;flex:1 1 140px}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:var(--f-mono);font-weight:500}
.lc{width:100%;height:auto;display:block}
.lc .gl{stroke:var(--line);stroke-width:1}
.lc .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.lc .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lc .lp{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 6}
.lc .ar{fill:url(#lgr)}
.lc .tg{stroke:var(--sky);stroke-width:1.8;stroke-dasharray:6 5;fill:none}
.lc .tgl{fill:var(--sky-ink);font-size:11px;font-weight:700}
.lc .ep{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.lc .vl{fill:var(--fg);font-size:12px;font-weight:700;font-family:var(--f-mono)}

/* pills, buttons, forms */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--sky-soft);color:var(--sky-ink)}
.zdot,.cdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:linear-gradient(100deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-fg);font-weight:700;box-shadow:0 8px 18px -10px var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.swt{position:relative;width:44px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--line);cursor:pointer;padding:0;transition:background .2s}.swt i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}.swt[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}.swt[aria-checked="true"] i{transform:translateX(18px)}.swt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="checkbox"],input[type="radio"]{width:auto;accent-color:var(--accent)}
textarea{min-height:76px;resize:vertical}
.num{width:84px;font-family:var(--f-mono);text-align:right}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 13px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .field{flex:1 1 180px}
.toolbar input,.toolbar select{width:auto;min-width:150px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 12px;white-space:nowrap;font-weight:700}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
td small{display:block;color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sg{min-width:620px}
.sg td,.sg th{text-align:center;padding:6px}
.sg td:first-child,.sg th:first-child{text-align:left}
.sl{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cell{display:block;width:100%;border:0;border-radius:9px;padding:6px 4px;font-size:12px;font-weight:600;min-width:64px;background:none}
.cell.bk{background:var(--sky-soft);color:var(--sky-ink)}
.cell.fr{background:var(--volt-soft);color:var(--volt-ink)}
.cell.no{color:var(--muted);opacity:.5}
.cell.on{background:linear-gradient(100deg,var(--accent),var(--accent-2));color:var(--accent-fg)}
.cell.off{background:var(--surface-2);color:var(--muted)}
.cell.ms{background:var(--bad-soft);color:var(--bad)}
.cell.ok{background:var(--volt-soft);color:var(--volt-ink)}
.cell.un{background:var(--warn-soft);color:var(--warn)}
.cell.ov{background:var(--violet-soft);color:var(--violet-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h7{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.cd{min-height:58px;border-radius:10px;border:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;font-size:11.5px;background:var(--surface);min-width:0}
.cd b{font-family:var(--f-mono);font-size:13px}
.cd.off{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cd.hi{background:var(--volt-soft);color:var(--volt-ink);border-color:transparent}
.cd.today{outline:2px solid var(--accent)}
.cd.pad{visibility:hidden}
.drng{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.drng input{width:150px;padding:7px 9px}
.cd.pend{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.cd.part{border-color:var(--bad)}
.cd em{font-style:normal;font-size:10px;font-weight:700;color:var(--bad)}
.cd .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:4px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;background:var(--volt-soft);color:var(--volt-ink);font-size:12px;font-weight:700;font-family:var(--f-mono)}
.dstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dstrip button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-size:12px;min-width:0}
.dstrip button[aria-pressed="true"]{background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--accent-fg);border-color:transparent}
.dstrip button[disabled]{opacity:.45}
.dstrip b{font-family:var(--f-mono);font-size:15px}
.dstrip small{font-size:10.5px;opacity:.8}
.rep{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.met{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.met div{display:flex;flex-direction:column;background:var(--surface-2);border-radius:10px;padding:6px 10px}
.met small{font-size:11px;color:var(--muted)}
.met b{font-family:var(--f-mono);font-size:14px;font-weight:600}
.fixbox{background:var(--good-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.listv{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.li>div{min-width:0}
.li b{display:block}
.li small{color:var(--muted);font-size:12px}
.msgs{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px}
@media (max-width:760px){.msgs{grid-template-columns:minmax(0,1fr)}}
.th{display:flex;flex-direction:column;gap:1px;text-align:left;width:100%;border:1px solid transparent;background:none;padding:8px 10px;border-radius:12px}
.th small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding:4px}
.bub{max-width:min(80%,460px);padding:8px 12px;border-radius:14px;background:var(--surface-2);font-size:13.5px;align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:var(--accent-fg)}
.bub small{display:block;font-size:11px;opacity:.75;margin-bottom:2px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 14px 34px -18px rgba(11,22,48,.4);display:flex;flex-direction:column;gap:14px;min-width:0}
.paper h4{font-size:21px}
.paper .pm{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:10px}
.wkh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acl{min-width:560px}
.acl select{width:auto;min-width:120px}

/* locked widgets */
.locked{position:relative;overflow:hidden}
.locked>.ghost{display:flex;flex-direction:column;gap:9px;filter:blur(5px);opacity:.55;pointer-events:none;user-select:none;min-height:120px}
.locked>.ghost i{display:block;height:10px;border-radius:99px;background:var(--accent)}
.lm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.lm div{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:12.5px;color:var(--muted);max-width:280px}
.lm b{color:var(--fg)}
.lm svg{color:var(--accent-ink)}

/* sheet, gate, toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,12,22,.6);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh h3{font-size:18px}
@media (min-width:700px){.scrim{align-items:center;padding:20px}.sheet{border-radius:18px}}
.gate{position:fixed;inset:0;z-index:90;background:linear-gradient(150deg,#050A18,#0E1B4A 70%,#1F3FBF);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gate::before{content:"";position:absolute;inset:0;background:linear-gradient(112deg,transparent 70%,var(--accent) 70% 74%,transparent 74% 76%,#C8F031 76% 78%,transparent 78% 80%,#2BC4FF 80% 82%,transparent 82%);opacity:.8;pointer-events:none}
.gate-in{position:relative;width:min(780px,100%);display:flex;flex-direction:column;gap:18px}
.gate h2{font-size:clamp(28px,5.5vw,42px);line-height:1.05;color:#F1F5FF}

function donut(segs,center,sub){
 const R=52,C=2*Math.PI*R,tot=segs.reduce((a,s)=>a+s.v,0)||1;let off=0;
 const arcs=segs.map(s=>{const len=Math.max(0,s.v/tot*C-(s.v>0?2:0));const e=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.c}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=s.v/tot*C;return e}).join('');
 return `<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="${esc(segs.map(s=>s.l+' '+s.v).join(', '))}"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="18"/>${arcs}<text x="70" y="72" text-anchor="middle" class="dn">${center}</text><text x="70" y="88" text-anchor="middle" class="ds">${sub}</text></svg><ul class="legend">${segs.map(s=>`<li><i style="background:${s.c}"></i>${esc(s.l)}<b>${s.v}</b></li>`).join('')}</ul></div>`}
function lineChart(vals,labels,target,partial){
 const W=640,H=240,L=46,R=14,T=16,B=30;
 const mx=Math.max(...vals,target)*1.05,st=[5e6,10e6,20e6,25e6,50e6,100e6].find(s=>mx/s<=5)||100e6,top=Math.ceil(mx/st)*st;
 const x=i=>L+i*(W-L-R)/(vals.length-1),y=v=>T+(H-T-B)*(1-v/top);
 let g='';for(let v=0;v<=top;v+=st)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v/1e6} jt</text>`;
 const pts=vals.map((v,i)=>[x(i),y(v)]);
 const d=a=>a.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const solid=partial?pts.slice(0,-1):pts,lp=pts[pts.length-1],pp=pts[pts.length-2];
 const area=d(pts)+` L${lp[0]} ${y(0)} L${pts[0][0]} ${y(0)} Z`;
 const lb=labels.map((l,i)=>`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===labels.length-1?'end':'middle'}">${l}</text>`).join('');
 return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pendapatan enam bulan terakhir dibanding target"><defs><linearGradient id="lgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:.02"/></linearGradient></defs>${g}<path class="ar" d="${area}"/><line class="tg" x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}"/><text class="tgl" x="${L+4}" y="${y(target)-6}">Target ${target/1e6} jt</text><path class="ln" d="${d(solid)}"/>${partial?`<path class="lp" d="M${pp[0]} ${pp[1]} L${lp[0]} ${lp[1]}"/>`:''}${lb}<circle class="ep" cx="${lp[0]}" cy="${lp[1]}" r="5"/><text class="vl" x="${lp[0]-10}" y="${lp[1]-10}" text-anchor="end">${(vals[vals.length-1]/1e6).toFixed(1)} jt</text></svg>`}

 return sheet(type==='masalah'?'Laporkan masalah':'Ajukan '+REQT[type].toLowerCase(),`<form data-form="req" class="fg"><input type="hidden" name="type" value="${type}">
 <label class="field"><span>${type==='izin_client'?'Klien':type==='masalah'?'Pelapor':'Coach'}</span><select name="who" ${mine&&type!=='izin_client'?'disabled':''}>${type==='masalah'?`<option value="${meId()}">${esc(meUser().name)}</option>`:whoOpts}</select></label>
 ${type==='masalah'?`<label class="field"><span>Tingkat</span><select name="sev"><option>Rendah</option><option selected>Sedang</option><option>Tinggi</option></select></label>`:`<label class="field"><span>${rs?'Jadwal lama (tanggal)':'Tanggal mulai'}</span><input id="f-rd1" name="date" type="date" value="${iso(TODAY)}" required></label><label class="field"><span>${rs?'Jadwal baru (tanggal)':'Tanggal selesai'}</span><input id="f-rd2" name="date2" type="date" value="${iso(TODAY)}" required></label>`}
 <label class="field full"><span>${type==='masalah'?'Jelaskan masalah':rs?'Detail sesi dan alasan':'Alasan'}</span><textarea id="f-rdet" name="detail" required placeholder="Tulis dengan singkat dan jelas"></textarea></label>
 <div class="row full"><button class="btn primary" type="submit">Kirim</button><button class="btn" type="button" data-act="close">Batal</button></div></form>`)};
FORMS.req=f=>{const type=f.get('type'),who=S.role==='coach'&&type!=='izin_client'?ME.coach:f.get('who');D.reqs.push({id:'r'+Date.now(),type,who:type==='masalah'?meId():who,date:f.get('date')||iso(TODAY),date2:f.get('date2')||f.get('date')||iso(TODAY),detail:f.get('detail').trim(),sev:f.get('sev')||undefined,status:'Menunggu',at:new Date()});logAct('mengajukan '+REQT[type].toLowerCase());S.modal=null;toast('Terkirim dan langsung tampil di portal Pemilik');render()};
ACT.attcompact=()=>{S.attCompact=!S.attCompact;render()};
ACT.cattset=t=>{
 const k=t.dataset.d,co=t.dataset.co,tm=t.dataset.t,v=t.dataset.s;
 if(!['Hadir','Tidak hadir'].includes(v)||!COACHES.includes(co))return;
 if(S.role==='coach'&&co!==ME.coach){toast('Hanya bisa mengisi absensi Anda sendiri');return}
 if(parse(k)>TODAY||!attOpen(k,tm)){toast('Belum bisa diisi. Terbuka pukul '+hhmm(attOpenAt(k,tm))+' (jadwal selesai)');render();return}
 D.attSlot=D.attSlot||{};
 D.attSlot[k+'|'+co+'|'+tm]={s:v,by:meUser().name,at:hhmm(new Date())};
 /* sinkron ke absensi harian coach (dipakai dashboard) */
 const recs=Object.keys(D.attSlot).filter(x=>x.startsWith(k+'|'+co+'|')).map(x=>({t:x.split('|')[2],s:D.attSlot[x].s}));
 const hd=recs.filter(r=>r.s==='Hadir').map(r=>r.t).sort();
 D.attCoach[co]=D.attCoach[co]||{};
 if(hd.length){const end=hhmm(attOpenAt(k,hd[hd.length-1]));D.attCoach[co][k]={in:hd[0],out:end}}
 else D.attCoach[co][k]={status:'Alpha'};
 logAct('mengonfirmasi absensi coach '+cname(co)+' ('+v+') '+tm);
 toast('Absensi '+first(cname(co))+' jam '+tm+': '+v);render()};
ACT.reqset=t=>{const r=D.reqs.find(x=>x.id===t.dataset.v);r.status=t.dataset.s;logAct((r.status==='Disetujui'?'menyetujui ':r.status==='Ditolak'?'menolak ':'menyelesaikan ')+REQT[r.type].toLowerCase()+' '+whoName(r));toast(['izin_coach','cuti','berhalangan'].includes(r.type)&&r.status==='Disetujui'?'Disetujui. Kalender coach diperbarui':'Status diperbarui');render()};

/* ================= 12. ANGGOTA ================= */
PAGES.anggota=()=>{
 const tabs=['Ringkasan','Daftar & kelola'],t=Math.min(S.tab,1),M=D.members;let body='';
 if(t===0)body=`<div class="kpis">${kpi('Total anggota',M.length,'akun aktif')}${kpi('Admin',M.filter(m=>m.role==='admin').length,'Tier 2')}${kpi('Head coach',M.filter(m=>m.role==='head').length,'Tier 3')}${kpi('Coach',M.filter(m=>m.role==='coach').length,'portal coach')}</div><section class="card"><header class="ch"><h3>Beban klien per anggota</h3></header>${hbar(COACHES.map(c=>({l:first(cname(c)),v:D.clients.filter(x=>x.coach===c&&!x.arch&&cstat(x)!=='Selesai').length})),v=>v+' klien')}</section>`;
 if(t===1)body=`<div class="toolbar"><span class="sp"></span><button class="btn primary" data-act="modal" data-v="member">${ic('plus',15)} Tambah anggota</button></div><div class="tw"><table><thead><tr><th>Nama</th><th>Peran</th><th>ID login</th><th>Email</th><th>Lokasi melatih</th><th></th></tr></thead><tbody>${M.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${pill(ROLE[m.role],m.role==='owner'?'info':'')}</td><td class="mono">${esc(m.login)}</td><td>${esc(m.email)}</td><td>${m.role==='coach'||m.role==='head'?esc(m.loc||'-'):'-'}</td><td><div class="row"><button class="btn sm" data-act="modal" data-v="memedit" data-id="${m.id}">${ic('edit',14)} Edit</button>${m.role==='owner'||m.id===meId()?'':`<button class="btn sm danger" data-act="memdel" data-v="${m.id}">${ic('trash',14)} Hapus</button>`}</div></td></tr>`).join('')}</tbody></table></div>`;
 return `<div class="stackv">${tabsBar(tabs)}${body}</div>`};
MODALS.member=()=>sheet('Tambah anggota',`<form data-form="member" class="fg"><label class="field full"><span>Nama lengkap</span><input id="f-mn" name="name" required></label><label class="field"><span>Peran</span><select name="role"><option value="coach">Coach</option><option value="head">Head Coach</option><option value="admin">Admin</option></select></label><label class="field"><span>ID login</span><input id="f-ml" name="login" required autocomplete="off"></label><label class="field full"><span>Email</span><input id="f-me" name="email" type="email" required></label><label class="field full"><span>Lokasi coach melatih (untuk Coach dan Head Coach)</span><input id="f-mloc" name="loc" placeholder="Contoh: GBK Senayan, Jakarta"></label><div class="row full"><button class="btn primary" type="submit">Tambah anggota</button><button class="btn" type="button" data-act="close">Batal</button></div></form>`);
MODALS.memedit=m=>{
 const x=D.members.find(v=>v.id===m.id);if(!x)return '';
 const isC=x.role==='coach'||x.role==='head';
 return sheet('Edit anggota',`<form data-form="memedit" class="fg"><input type="hidden" name="id" value="${x.id}">
 <label class="field full"><span>Nama lengkap</span><input id="f-en" name="name" required value="${esc(x.name)}"></label>
 <label class="field"><span>Peran</span>${isC?`<select name="role"><option value="coach" ${x.role==='coach'?'selected':''}>Coach</option><option value="head" ${x.role==='head'?'selected':''}>Head Coach</option></select>`:`<input value="${ROLE[x.role]}" disabled>`}</label>
 <label class="field"><span>ID login</span><input id="f-el" name="login" required autocomplete="off" value="${esc(x.login)}"></label>
 <label class="field"><span>Email</span><input id="f-ee" name="email" type="email" required value="${esc(x.email)}"></label>
 <label class="field"><span>WhatsApp</span><input id="f-ew" name="wa" inputmode="tel" value="${esc(x.wa||'')}"></label>
 ${isC?`<label class="field full"><span>Lokasi coach melatih</span><input id="f-eloc" name="loc" placeholder="Contoh: GBK Senayan, Jakarta" value="${esc(x.loc||'')}"></label>`:''}
 <div class="row full"><button class="btn primary" type="submit">Simpan perubahan</button><button class="btn" type="button" data-act="close">Batal</button></div></form>`)};
FORMS.memedit=f=>{
 const x=D.members.find(v=>v.id===f.get('id'));if(!x)return;
 const lg=f.get('login').trim();
 if(D.members.some(v=>v.id!==x.id&&v.login===lg)){toast('ID login sudah dipakai');return}
 x.name=f.get('name').trim();x.login=lg;x.email=f.get('email').trim();x.wa=(f.get('wa')||'').trim();
 if(x.role==='coach'||x.role==='head'){x.role=f.get('role')||x.role;x.loc=(f.get('loc')||'').trim()}
 logAct('mengedit anggota '+x.name);S.modal=null;toast('Data '+first(x.name)+' diperbarui');render()};
FORMS.member=f=>{const id='u'+Date.now(),role=f.get('role');D.members.push({id,name:f.get('name').trim(),role,login:f.get('login').trim(),email:f.get('email').trim(),wa:'',loc:(f.get('loc')||'').trim()});if(role!=='admin'){COACHES.push(id);initCoach(id)}logAct('menambah anggota '+f.get('name'));S.modal=null;toast('Anggota ditambahkan');render()};
ACT.memdel=t=>{const m=D.members.find(x=>x.id===t.dataset.v);if(D.clients.some(c=>c.coach===m.id&&!c.arch)){toast('Pindahkan klien '+first(m.name)+' ke coach lain dulu');return}S.modal={k:'confirm',text:'Hapus anggota '+m.name+'? Akunnya tidak bisa masuk lagi.',yes:'delmem',arg:m.id,label:'Hapus anggota'};render()};
CONF.delmem=id=>{const m=D.members.find(x=>x.id===id);D.members=D.members.filter(x=>x.id!==id);const i=COACHES.indexOf(id);if(i>=0)COACHES.splice(i,1);D.book=D.book.filter(b=>b.coach!==id);logAct('menghapus anggota '+m.name)};

/* ================= 13. SETTING ================= */
const ACLV=[['full','Penuh'],['mask','Disensor'],['none','Tersembunyi']];
PAGES.setting=()=>{
 const tabs=['Profile','Login & sesi','ID & password','Tema'];if(S.role==='owner')tabs.push('Hak akses');
 const t=Math.min(S.tab,tabs.length-1),me=meUser();let body='';
 if(t===0)body=`<section class="card"><div class="row"><span class="av" style="width:48px;height:48px;font-size:20px">${esc(me.name[0])}</span><div><b>${esc(me.name)}</b><p class="sub">${ROLE[me.role]}</p></div></div><form data-form="profile" class="fg"><label class="field"><span>Nama</span><input id="f-pfn" name="name" value="${esc(me.name)}" required></label><label class="field"><span>Email</span><input id="f-pfe" name="email" type="email" value="${esc(me.email)}" required></label><label class="field"><span>WhatsApp</span><input id="f-pfw" name="wa" value="${esc(me.wa)}"></label><div class="row full"><button class="btn primary" type="submit">Simpan profil</button></div></form></section>`;
 if(t===1)body=`<section class="card"><header class="ch"><h3>Sesi saat ini</h3></header><div class="li"><div><b>${esc(me.name)}</b><small>Masuk sebagai ${ROLE[me.role]}</small></div><button class="btn" data-act="logout">${ic('out',15)} Keluar</button></div></section><section class="card"><header class="ch"><h3>Perangkat tersambung</h3><span class="sub">Contoh status sinkronisasi</span></header><div class="listv"><div class="li"><div><b>Portal Pemilik</b><small>Web, sesi ini</small></div>${pill('Online','good')}</div><div class="li"><div><b>Portal Coach, Dimas Pratama</b><small>Ponsel</small></div>${pill('Online','good')}</div><div class="li"><div><b>Portal Coach, Lestari Ayu</b><small>Terakhir aktif 2 jam lalu</small></div>${pill('Offline')}</div></div></section><section class="card"><header class="ch"><h3>Data contoh dan sinkronisasi</h3></header><p class="sub">Portal Pemilik dan portal Coach berbagi data lewat penyimpanan browser yang sama. Pada produksi, keduanya membaca satu database di server.</p><div><button class="btn danger" data-act="syncreset">Atur ulang data contoh</button></div></section>`;
 if(t===2)body=`<section class="card"><form data-form="pw" class="fg"><label class="field"><span>ID login</span><input id="f-pid" value="${esc(me.login)}" readonly></label><div></div><label class="field"><span>Password saat ini</span><input id="f-pw0" name="old" type="password" autocomplete="current-password" required></label><label class="field"><span>Password baru (minimal 8 karakter)</span><input id="f-pw1" name="new" type="password" autocomplete="new-password" required></label><label class="field"><span>Ulangi password baru</span><input id="f-pw2" name="new2" type="password" autocomplete="new-password" required></label><div class="row full"><button class="btn primary" type="submit">Ganti password</button></div></form><p class="sub">Prototipe ini tidak menyimpan password.</p></section>`;
 if(t===3)body=`<section class="card"><header class="ch"><h3>Tema tampilan</h3></header>${seg('theme',S.theme,[['light','Terang'],['dark','Gelap'],['system','Ikuti perangkat']])}<p class="sub">Warna mengikuti pilihan Anda di semua halaman, termasuk grafik dan laporan.</p></section>`;
 if(t===4){
  body=`${banner('Pemilik menentukan apa yang boleh dilihat tiap peran. Disensor berarti halaman tetap terbuka tetapi nominal keuangan dan komisi disembunyikan. Tersembunyi berarti modul hilang dari menu. Untuk Coach, Penuh berarti hanya data klien dan jadwal miliknya.')}
  <div class="tw"><table class="acl"><thead><tr><th>Modul</th><th>Admin</th><th>Head Coach</th><th>Coach</th></tr></thead><tbody>${MODS.filter(m=>m[0]!=='setting').map(([k,l])=>`<tr><td><b>${l}</b></td>${['admin','head','coach'].map(r=>`<td><select id="f-acl-${r}-${k}" data-set="D.acl.${r}.${k}" aria-label="${l} untuk ${ROLE[r]}">${ACLV.map(([v,n])=>`<option value="${v}" ${D.acl[r][k]===v?'selected':''}>${n}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="row"><span class="sub">Pratinjau hasilnya:</span>${['admin','head','coach'].map(r=>`<button class="btn sm" data-act="role" data-v="${r}">Lihat sebagai ${ROLE[r]}</button>`).join('')}</div>`}
 return `<div class="stackv">${tabsBar(tabs)}${body}</div>`};
ACT.syncreset=()=>syncReset();
FORMS.profile=f=>{const m=meUser();m.name=f.get('name').trim();m.email=f.get('email').trim();m.wa=f.get('wa').trim();logAct('memperbarui profil');toast('Profil disimpan');render()};
FORMS.pw=f=>{if(f.get('new').length<8){toast('Password baru minimal 8 karakter');return}if(f.get('new')!==f.get('new2')){toast('Konfirmasi password tidak sama');return}toast('Password diganti');render()};

/* ================= 14. PROGRESS ================= */
PAGES.progress=()=>{
 const steps=[['done','Prototipe antarmuka dan alur','Semua modul dari daftar fitur dapat diklik dengan data contoh, termasuk portal Coach dan pengaturan hak akses.','Selesai'],['now','Database dan sinkronisasi','Satu database untuk portal Pemilik dan Coach. Perubahan coach tampil di portal Pemilik tanpa muat ulang.','Berikutnya'],['','Login dan hak akses sungguhan','Akun per anggota. Peran dan sensor data sensitif ditegakkan di server, bukan hanya di tampilan.','Direncanakan'],['','Ekspor PDF, JPG, dan WhatsApp','Program latihan dan laporan keluar sebagai file. Broadcast terkirim ke WhatsApp klien.','Direncanakan'],['','Uji coba dengan coach','Pilot dua minggu bersama beberapa coach, lalu perbaikan dari masukan.','Direncanakan']];
 return `<div class="stackv"><div class="road">${steps.map(([k,t,d,s],i)=>`<div class="step ${k}"><span class="no">${k==='done'?ic('check',14):i+1}</span><div><b>${t}</b><p>${d}</p></div>${pill(s,k==='done'?'good':k==='now'?'info':'')}</div>`).join('')}</div>
 <section class="card"><header class="ch"><h3>Modul pada prototipe</h3><span class="sub">13 modul aplikasi dan halaman progres ini</span></header><div class="modgrid">${MODS.map(([k,l])=>`<div>${ic('check',16)}${l}</div>`).join('')}</div></section></div>`};
/* ================= actions, events, boot ================= */
const SYNC_APP='owner';
function save(){try{localStorage.setItem('gf-prefs',JSON.stringify({role:S.role,theme:S.theme}));localStorage.setItem('nsr-theme',S.theme)}catch(e){}}
function applyTheme(){const r=document.documentElement;if(S.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}
function ensurePage(){if(!(can(S.page)||S.page==='setting'))S.page='beranda'}
function setPath(p,v){const a=p.split('.');let o=a[0]==='S'?S:D;for(let i=1;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
Object.assign(ACT,{
 nav:t=>go(t.dataset.v),
 menu:()=>{S.nav=!S.nav;render()},
 role:t=>{S.role=t.dataset.v;ensurePage();S.tab=0;S.modal=null;S.nav=false;S.q='';if(S.role==='coach'){S.sched=ME.coach;S.cal=ME.coach;S.share=ME.coach;S.kcoach='all'}save();render(false)},
 enter:t=>{S.gate=false;ACT.role(t)},
 logout:()=>{S.gate=true;S.nav=false;render(false)},
 tab:t=>{S.tab=+t.dataset.v;S.editfix=null;render()},
 tp:t=>{S.tp=t.dataset.v;render()},
 theme:t=>{S.theme=t.dataset.v;applyTheme();save();render()},
 modal:t=>{S.modal={k:t.dataset.v,id:t.dataset.id||null};render()},
 close:()=>{S.modal=null;render()},
 yes:()=>{const m=S.modal;if(m&&CONF[m.yes])CONF[m.yes](m.arg);S.modal=null;toast('Selesai');render()}
});
document.addEventListener('click',e=>{
 const sc=e.target.closest('.scrim');if(sc&&e.target===sc){S.modal=null;render();return}
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
 const f=ACT[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;
 e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(new FormData(f),f);
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.hasAttribute&&t.hasAttribute('data-idl')){const p=document.getElementById('idprev');if(p)p.innerHTML=idPreview(t.value,t.dataset.coach);return}
 if(t.hasAttribute&&t.hasAttribute('data-qm')){S.mq=t.value;S.focus={id:t.id,pos:t.selectionStart};render();return}
 if(t.hasAttribute&&t.hasAttribute('data-q')){S.q=t.value;S.focus={id:t.id,pos:t.selectionStart};render()}
});
document.addEventListener('change',e=>{
 const t=e.target;if(!t.dataset)return;
 if(t.hasAttribute('data-cform')){clientFormSync(t);return}
 if(t.hasAttribute('data-tsel')){const w=document.getElementById('ctw');if(w)w.hidden=t.value!=='custom';return}
 if(t.dataset.f){S[t.dataset.f]=t.hasAttribute('data-n')?+t.value:t.value;render();return}
 if(t.hasAttribute('data-tpl')){
  const form=t.closest('form'),r=D.reports.find(x=>x.id===form.dataset.id),tp=D.tpl.find(x=>x.id===t.value);
  if(r&&tp){form.querySelector('textarea').value=fillTpl(tp.text,cl(r.cid).name,r.type)}
  return}
 if(t.hasAttribute('data-apply')){ACT.applyps(t);return}
 if(t.dataset.set){
  const p=t.dataset.set;let v=t.value;
  if(t.type==='checkbox')v=t.checked;
  else if(t.hasAttribute('data-num'))v=num(v);
  setPath(p,v);if(HOOK[p])HOOK[p]();
  if(t.hasAttribute('data-unitwk')){const mm=String(v).match(/(\d+)\s*(minggu|mgg)/i);if(mm)D.programs[+p.split('.')[2]].wk=+mm[1]}
  if(p.startsWith('D.programs')||p.startsWith('D.targets'))S.syncAt=new Date();
  S.focus=null;render();
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});

(function boot(){
 try{const v=JSON.parse(localStorage.getItem('gf-prefs')||'{}');if(v.role&&ROLE[v.role])S.role=v.role;if(v.theme==='light'||v.theme==='dark')S.theme=v.theme}catch(e){}
 try{const th=localStorage.getItem('nsr-theme');if(th==='light'||th==='dark'||th==='system')S.theme=th}catch(e){}
 syncBoot();
 syncListen(()=>{try{ensurePage()}catch(e){}const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){a.addEventListener('blur',()=>render(),{once:true})}else{render()}toast('Data diperbarui dari portal lain')});
 if(S.role==='coach'){S.sched=ME.coach;S.cal=ME.coach;S.share=ME.coach}
 D.clients=D.clients.filter(c=>!c.arch||(TODAY-parse(c.arch))/864e5<7);
 const hm=location.hash.match(/^#c=([A-Za-z0-9-]+)/);if(hm){const k=byUid(hm[1]);S.cview=k?k.id:'x'}
 window.addEventListener('hashchange',()=>{try{location.reload()}catch(e){}});
 applyTheme();ensurePage();render(false);
})();

</script>
